  <text x="120" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0D1B3D">desain</text>
  <!-- handle seleksi -->
  <line x1="66" y1="98" x2="66" y2="134" stroke="#0B5CFF" stroke-width="3.5"/>
