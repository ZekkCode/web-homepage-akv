  <path d="M110 68 L120 82 L130 68 Z" fill="#0D1B3D"/>
  <line x1="120" y1="26" x2="120" y2="56" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
  <text x="74" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Copy</text>
  <text x="167" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Paste</text>
